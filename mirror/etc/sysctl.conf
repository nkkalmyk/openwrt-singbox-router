# User defined entries should be added to this file not to /etc/sysctl.d/* as
# that directory is not backed-up by default and will not survive a reimage
net.netfilter.nf_conntrack_max=65536
net.netfilter.nf_conntrack_tcp_timeout_established=1800
net.netfilter.nf_conntrack_udp_timeout=30
# Сокеты к мёртвой ноде VPN закрываются за секунды (0 = 8 повторов, висели минутами); лимит сирот с запасом.
# 2026-10-04 18:27 ядро упёрлось в 1024 сироты (too many orphaned sockets) во время сбоя ноды.
net.ipv4.tcp_orphan_retries=3
net.ipv4.tcp_max_orphans=2048
